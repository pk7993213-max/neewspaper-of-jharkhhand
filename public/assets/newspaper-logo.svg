<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a0404" />
      <stop offset="100%" stop-color="#1f0202" />
    </linearGradient>
  </defs>

  <!-- Top Decorative Rules -->
  <line x1="20" y1="14" x2="740" y2="14" stroke="#800000" stroke-width="1.5" />
  <line x1="20" y1="18" x2="740" y2="18" stroke="#1c1917" stroke-width="0.75" />

  <!-- Top Metadata String -->
  <text x="380" y="32" font-family="'Times New Roman', Times, serif" font-size="10.5" font-weight="bold" letter-spacing="3" fill="#57534e" text-anchor="middle">
    ESTABLISHED 1947 • TRUTH • INTEGRITY • PUBLIC INTEREST • RANCHI &amp; NATIONAL DAILY
  </text>

  <!-- Left Emblem / Crest -->
  <g transform="translate(68, 52)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="url(#crestGold)" stroke-width="2.5" />
    <circle cx="24" cy="24" r="18" fill="#800000" />
    <!-- Feather Quill & Column -->
    <path d="M24 10 L27 20 L24 38 L21 20 Z" fill="#ffffff" />
    <circle cx="24" cy="24" r="3" fill="#f59e0b" />
    <path d="M12 24 C12 18 18 12 24 12" fill="none" stroke="#fcd34d" stroke-width="1.5" />
    <path d="M36 24 C36 30 30 36 24 36" fill="none" stroke="#fcd34d" stroke-width="1.5" />
  </g>

  <!-- Main Newspaper Logotype -->
  <g transform="translate(130, 88)">
    <!-- Primary Masthead Text -->
    <text x="240" y="0" font-family="'Playfair Display', 'Times New Roman', Georgia, serif" font-size="52" font-weight="900" letter-spacing="-1" fill="#1c1917" text-anchor="middle">
      THE BHARAT CHRONICLE
    </text>
  </g>

  <!-- Right Emblem / Crest -->
  <g transform="translate(644, 52)">
    <circle cx="24" cy="24" r="22" fill="none" stroke="url(#crestGold)" stroke-width="2.5" />
    <circle cx="24" cy="24" r="18" fill="#800000" />
    <path d="M24 10 L27 20 L24 38 L21 20 Z" fill="#ffffff" />
    <circle cx="24" cy="24" r="3" fill="#f59e0b" />
    <path d="M12 24 C12 18 18 12 24 12" fill="none" stroke="#fcd34d" stroke-width="1.5" />
    <path d="M36 24 C36 30 30 36 24 36" fill="none" stroke="#fcd34d" stroke-width="1.5" />
  </g>

  <!-- Bottom Subtitle Bar -->
  <text x="380" y="116" font-family="'Times New Roman', Times, serif" font-size="12" font-style="italic" fill="#44403c" text-anchor="middle" letter-spacing="1.5">
    India's Premier Independent Broadsheet • Ground Investigations &amp; Digital News Desk
  </text>

  <!-- Bottom Double Rule -->
  <line x1="20" y1="128" x2="740" y2="128" stroke="#1c1917" stroke-width="0.75" />
  <line x1="20" y1="132" x2="740" y2="132" stroke="#800000" stroke-width="2" />
</svg>
